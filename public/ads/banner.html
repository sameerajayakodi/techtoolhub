<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Advertisement</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!--
      One Adsterra banner, loaded by components/AdsterraBanner.tsx as
      /ads/banner.html?k=<key>&w=<width>&h=<height>. Each banner gets its own page because
      Adsterra's code reads a global `atOptions`, so two banners can't share one document.
    -->
    <script>
      ;(function () {
        var p = new URLSearchParams(location.search)
        var key = p.get('k') || ''
        var w = parseInt(p.get('w'), 10)
        var h = parseInt(p.get('h'), 10)
        if (!/^[a-f0-9]{32}$/.test(key) || !(w > 0) || !(h > 0)) return
        window.atOptions = { key: key, format: 'iframe', height: h, width: w, params: {} }
        // Adsterra's invoke script must run synchronously while the page is parsed
        document.write('<script src="https://bicea.org/22/' + key + '"><\/script>')
      })()
    </script>
  </body>
</html>
